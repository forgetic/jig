name: ci

env:
  KACHE_CONFIG: "/etc/kache/config.toml"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs and test executables).
# skein is a git dependency (pinned by rev), so Cargo fetches it itself — no
# sibling checkout, working-directory trick, or path-dependency layout needed.
jobs:
  validate:
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build tests
        run: cargo test --workspace --no-run
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
