name: ci

env:
  KACHE_CONFIG: "/etc/kache/config.toml"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs and test executables).
# Every dependency is a workspace crate or comes from crates.io, so a plain
# checkout builds: no sibling checkout or path-dependency layout is needed.
jobs:
  validate:
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: rustc -Vv && cargo -V && cargo clippy -V
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build tests
        run: cargo test --workspace --no-run
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
