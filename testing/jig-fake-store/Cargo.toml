[package]
name = "jig-fake-store"
description = "Ordered durable fake store for jig's domain worlds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-test-domain.workspace = true

[dev-dependencies]
jig-test-connector.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# This fake is ordinary Rust; the strict step-code subset applies to the root.
disallowed_types = "allow"
disallowed_methods = "allow"
disallowed_macros = "allow"
