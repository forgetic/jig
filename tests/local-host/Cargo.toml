[package]
name = "jig-local-host-world"
description = "Scripted core and fake provider around the local Smith host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-local-host.workspace = true
skein-lib.workspace = true
skein-world.workspace = true
skein-fake-llm-domain.workspace = true
smith-domain.workspace = true
smith-agent-world.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
